[project]
name = "ai-ecosystem-workspace"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pyright>=1.1.405,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["products/*/apps/*", "products/*/packages/*", "packages/*"]
exclude = ["products/*/apps/web"]

[tool.uv.sources]
knowledge-ai = { workspace = true }
knowledge-api = { workspace = true }
knowledge-auth = { workspace = true }
knowledge-core = { workspace = true }
knowledge-db = { workspace = true }
knowledge-mcp = { workspace = true }
knowledge-schemas = { workspace = true }
knowledge-search = { workspace = true }
agent-api = { workspace = true }
agent-ai = { workspace = true }
agent-auth = { workspace = true }
agent-knowledge = { workspace = true }
agent-state = { workspace = true }

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["products/*/apps/*/src", "products/*/packages/*/src", "packages/*/src", "products/*/tests"]
extend-exclude = ["README.md", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["products/*/apps", "products/*/packages", "products/*/tests"]
exclude = ["**/__pycache__", "products/knowledge/packages/db/hatch_build.py"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["products/*/tests"]
markers = [
  "integration: requires local infrastructure",
  "e2e: exercises a runnable application boundary",
]

[tool.coverage.run]
branch = true
source = ["knowledge_api", "knowledge_auth", "knowledge_core", "knowledge_db", "knowledge_mcp", "knowledge_schemas", "agent_ai", "agent_api", "agent_auth", "agent_knowledge", "agent_state"]
omit = [
  "products/knowledge/packages/db/src/knowledge_db/defaults.py",
  "products/knowledge/packages/db/src/knowledge_db/seed.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
