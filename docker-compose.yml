name: ai-ecosystem

services:
  knowledge-postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: knowledge
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - knowledge-postgres-data:/var/lib/postgresql/data
      - ./products/knowledge/docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 2s
      timeout: 5s
      retries: 15

  knowledge-api:
    build:
      context: .
      dockerfile: products/knowledge/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@knowledge-postgres:5432/knowledge
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-10}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-30000}
      DATABASE_LOCK_TIMEOUT_MS: ${DATABASE_LOCK_TIMEOUT_MS:-5000}
      LOCAL_BEARER_TOKEN: ${LOCAL_BEARER_TOKEN:-knowledge-local-dev}
      LOCAL_ORGANIZATION_ID: ${LOCAL_ORGANIZATION_ID:-35982da3-60ae-5eea-b46a-088c3cc0f278}
      LOCAL_PRINCIPAL_ID: ${LOCAL_PRINCIPAL_ID:-7f180c45-c2f9-5f9d-b715-bf68f4ced724}
      LOCAL_GROUP_IDS: ${LOCAL_GROUP_IDS:-["8bde0934-4daa-5afa-a9c3-24e849557486"]}
      LOCAL_IDENTITY_SECRET: ${LOCAL_IDENTITY_SECRET:-ai-ecosystem-local-identity-secret}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      knowledge-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

  knowledge-web:
    build:
      context: .
      dockerfile: products/knowledge/Dockerfile
      target: web
    environment:
      KNOWLEDGE_API_URL: http://knowledge-api:8000
      LOCAL_BEARER_TOKEN: ${LOCAL_BEARER_TOKEN:-knowledge-local-dev}
      LOCAL_IDENTITY_SECRET: ${LOCAL_IDENTITY_SECRET:-ai-ecosystem-local-identity-secret}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      knowledge-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/sign-in').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 2s
      timeout: 5s
      retries: 15

  knowledge-migrate:
    build:
      context: .
      dockerfile: products/knowledge/Dockerfile
      target: api
    command: ["alembic", "-c", "products/knowledge/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://knowledge:knowledge@knowledge-postgres:5432/knowledge
    depends_on:
      knowledge-postgres:
        condition: service_healthy
    restart: "no"

  agent-api:
    build:
      context: .
      dockerfile: products/agent/Dockerfile
      target: api
    environment:
      KNOWLEDGE_URL: http://knowledge-api:8000
      KNOWLEDGE_API_KEY: ${LOCAL_BEARER_TOKEN:-knowledge-local-dev}
      KNOWLEDGE_CONNECT_TIMEOUT_SECONDS: ${KNOWLEDGE_CONNECT_TIMEOUT_SECONDS:-2}
      KNOWLEDGE_READ_TIMEOUT_SECONDS: ${KNOWLEDGE_READ_TIMEOUT_SECONDS:-5}
      MODEL_BACKEND: deterministic
      DETERMINISTIC_STREAM_DELAY_SECONDS: ${AGENT_DETERMINISTIC_STREAM_DELAY_SECONDS:-0.25}
      AGENT_DATABASE_URL: postgresql+psycopg://knowledge:knowledge@knowledge-postgres:5432/agent
      AGENT_LOCAL_BEARER_TOKEN: ${AGENT_LOCAL_BEARER_TOKEN:-agent-local-dev}
      AGENT_LOCAL_OWNER_ID: ${AGENT_LOCAL_OWNER_ID:-agent-local-user}
      LOCAL_IDENTITY_SECRET: ${LOCAL_IDENTITY_SECRET:-ai-ecosystem-local-identity-secret}
    ports:
      - "${AGENT_API_PORT:-8100}:8000"
    depends_on:
      agent-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 2s
      timeout: 5s
      retries: 15

  agent-migrate:
    build:
      context: .
      dockerfile: products/agent/Dockerfile
      target: api
    command: ["alembic", "-c", "products/agent/alembic.ini", "upgrade", "head"]
    environment:
      AGENT_DATABASE_URL: postgresql+psycopg://knowledge:knowledge@knowledge-postgres:5432/agent
    depends_on:
      agent-db-init:
        condition: service_completed_successfully
    restart: "no"

  agent-db-init:
    image: pgvector/pgvector:pg17
    environment:
      PGPASSWORD: knowledge
    command:
      [
        "sh",
        "-c",
        "psql -h knowledge-postgres -U knowledge -d knowledge -tAc \"SELECT 1 FROM pg_database WHERE datname='agent'\" | grep -q 1 || createdb -h knowledge-postgres -U knowledge -O knowledge agent",
      ]
    depends_on:
      knowledge-postgres:
        condition: service_healthy
    restart: "no"

  agent-web:
    build:
      context: .
      dockerfile: products/agent/Dockerfile
      target: web
    environment:
      AGENT_API_URL: http://agent-api:8000
      AGENT_API_BEARER_TOKEN: ${AGENT_LOCAL_BEARER_TOKEN:-agent-local-dev}
      LOCAL_IDENTITY_SECRET: ${LOCAL_IDENTITY_SECRET:-ai-ecosystem-local-identity-secret}
    ports:
      - "${AGENT_WEB_PORT:-3100}:3000"
    depends_on:
      agent-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/sign-in').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  knowledge-postgres-data:
