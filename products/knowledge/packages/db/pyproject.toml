[project]
name = "knowledge-db"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16,<2",
  "knowledge-ai",
  "knowledge-search",
  "knowledge-schemas",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "pgvector>=0.4,<1",
]

[tool.uv.sources]
knowledge-schemas = { workspace = true }
knowledge-ai = { workspace = true }
knowledge-search = { workspace = true }

[project.scripts]
knowledge-seed-northstar = "knowledge_db.seed:run"
knowledge-seed-defaults = "knowledge_db.defaults:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
