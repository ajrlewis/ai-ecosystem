[project]
name = "knowledge-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "knowledge-auth",
  "knowledge-ai",
  "knowledge-db",
  "knowledge-search",
  "knowledge-schemas",
  "pydantic-settings>=2.10,<3",
]

[tool.uv.sources]
knowledge-auth = { workspace = true }
knowledge-ai = { workspace = true }
knowledge-db = { workspace = true }
knowledge-search = { workspace = true }
knowledge-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
