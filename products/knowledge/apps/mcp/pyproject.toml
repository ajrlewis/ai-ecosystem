[project]
name = "knowledge-mcp"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "anyio>=4.10,<5",
  "knowledge-auth",
  "knowledge-core",
  "knowledge-schemas",
  # 47+ no longer publishes x86_64 macOS wheels; keep local Intel development working.
  "cryptography>=46,<47",
  "fastmcp>=2.12,<3",
]

[project.scripts]
knowledge-mcp = "knowledge_mcp.server:run"

[tool.uv.sources]
knowledge-auth = { workspace = true }
knowledge-core = { workspace = true }
knowledge-schemas = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
